# Pulse stack — collector + frontend only.
#
# TLS + public ingress is handled by the platform's existing Caddy (running in
# the main automation-platform compose), which reverse-proxies pulse.opuslogic.eu
# to our frontend container. We join the same network so Caddy can reach us.
services:
  collector:
    build: ../collector
    container_name: pulse_collector
    restart: unless-stopped
    environment:
      PULSE_DB_PATH: /data/pulse.duckdb
      PULSE_POLL_INTERVAL: "10"
      PULSE_RETENTION_DAYS: "90"
      PULSE_BACKEND_URL: ${PULSE_BACKEND_URL:-https://opuslogic_backend:443}
      PULSE_ZITADEL_URL: ${PULSE_ZITADEL_URL:-http://opuslogic_zitadel:8080}
      PULSE_TEMPORAL_URL: ${PULSE_TEMPORAL_URL:-opuslogic_temporal:7233}
      PULSE_POSTGRES_DSN: ${PULSE_POSTGRES_DSN}
      PULSE_PROC_PATH: /host/proc
      PULSE_SYS_PATH: /host/sys
      # R10.1-PLAT security probe — platform posture dashboard. Base URL
      # used for ingress-surface + TLS + agent-binary-signed checks.
      PULSE_PLATFORM_URL: ${PULSE_PLATFORM_URL:-https://dev.opuslogic.eu}
      PULSE_PLATFORM_HOST_ROOT: /host
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_PROJECT_ID: ${OIDC_PROJECT_ID}
      # R657.4/R657.5 (OpusLogic Block 219, 2026-09-06). DuckDB 1.1.3 sizes its
      # buffer pool at 80 % of the HOST's RAM (6.1 GiB on this VPS) and ignores
      # the container's cgroup limit — measured with `docker run --memory=1g`.
      # Without this inner limit the mem_limit below is a restart machine: the
      # pool grows past the cap and the kernel kills the collector. With it,
      # DuckDB spills to disk instead. Keep this under mem_limit with room for
      # Python and the probes (~150 MiB resident, measured).
      PULSE_DUCKDB_MEMORY_LIMIT: ${PULSE_DUCKDB_MEMORY_LIMIT:-1GB}
    volumes:
      - pulse_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # R10.1-PLAT: read-only host mounts for the security probe.
      # The probe inspects mode/owner/age — never reads .env contents.
      - /opt/backups:/host/opt/backups:ro
      - /opt/opuslogic:/host/opt/opuslogic:ro
      - /etc/opuslogic:/host/etc/opuslogic:ro
    # R657.4. Sized against the readings that exist: 2.06 GiB resident on
    # 2026-09-06 (Block 218), 2.14 GiB resident+swapped later that day, cgroup
    # peak 3.81 GiB since 2026-04-24 — all of it DuckDB's uncapped pool, not a
    # working set: with PULSE_DUCKDB_MEMORY_LIMIT=1GB the process needs the pool
    # plus ~150 MiB. A cap turns a leak into a RESTART rather than a platform
    # kill; the restart is visible in `docker ps` (RestartCount) and on the
    # platform's hourly watch line (pulse_rss_mb / pulse_db_age_s).
    mem_limit: 1536m
    memswap_limit: 1536m
    networks:
      - opuslogic-network

  frontend:
    build:
      context: ../frontend
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID}
    container_name: pulse_frontend
    restart: unless-stopped
    depends_on:
      - collector
    # R657.3. The public Caddy route (pulse.opuslogic.eu) is gone; the
    # dashboard is reached from the host only:
    #   ssh -L 7501:127.0.0.1:7501 <user>@87.106.91.170   →  http://localhost:7501
    # The Zitadel app `pulse-frontend` must list http://localhost:7501 as a
    # redirect URI for the login to complete there.
    ports:
      - "127.0.0.1:7501:80"
    networks:
      - opuslogic-network

volumes:
  pulse_data:

networks:
  opuslogic-network:
    external: true
